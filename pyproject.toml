[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mert-tools"
version = "0.1.0"
description = "A small MCP capability layer for notes, tasks, and vision workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "openai>=2,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
mert-tools = "mert_tools.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mert_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
